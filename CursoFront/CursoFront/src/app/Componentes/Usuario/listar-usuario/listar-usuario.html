<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Lista de Usuarios</h2>
      <div>
        <button (click)="nuevo()">Nuevo</button>
        <button (click)="irRoles()">Roles</button>
      </div>
    </div>

    <div class="card-body">

      <div class="filtros">
        <input type="text" [(ngModel)]="q" placeholder="Buscar por nombre o apellidos">
        <button (click)="buscar()">Buscar</button>

        <select [(ngModel)]="idRolSeleccionado" (change)="filtrarPorRol()">
          <option [ngValue]="0">-- Filtrar por rol --</option>
          <option *ngFor="let r of roles" [ngValue]="r.idRol">{{ r.privilegio }}</option>
        </select>

        <button (click)="limpiarFiltros()">Limpiar</button>
      </div>

      <table border="1" width="100%">
        <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>APP</th>
            <th>APM</th>
            <th>SEXO</th>
            <th>CORREO</th>
            <th>F. NAC</th>
            <th>F. CREACIÓN</th>
            <th>ROL</th>
            <th>ACCIONES</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let u of usuarios">
            <td>{{ u.idUsuario }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.app }}</td>
            <td>{{ u.apm }}</td>
            <td>{{ u.sexo }}</td>
            <td>{{ u.correo }}</td>
            <td>{{ u.fechaNacimiento }}</td>
            <td>{{ u.fechaCreacion }}</td>
            <td>{{ u.rol?.privilegio }}</td>
            <td>
              <button (click)="editar(u.idUsuario)">Editar</button>
              <button (click)="eliminar(u.idUsuario)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>
