<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Registrar Usuario</h2>
    </div>

    <div class="card-body">
      <form>

        <div class="form-group">
          <label>NOMBRE</label>
          <input type="text" name="nombre" [(ngModel)]="usuario.nombre" placeholder="Nombre">
        </div>

        <div class="form-group">
          <label>APP</label>
          <input type="text" name="app" [(ngModel)]="usuario.app" placeholder="Apellido paterno">
        </div>

        <div class="form-group">
          <label>APM</label>
          <input type="text" name="apm" [(ngModel)]="usuario.apm" placeholder="Apellido materno">
        </div>

        <div class="form-group">
          <label>SEXO</label>
          <input type="text" name="sexo" [(ngModel)]="usuario.sexo" placeholder="Femenino / Masculino">
        </div>

        <div class="form-group">
          <label>FECHA NACIMIENTO</label>
          <input type="date" name="fechaNacimiento" [(ngModel)]="usuario.fechaNacimiento">
        </div>

        <div class="form-group">
          <label>ROL</label>
          <select name="rol" [(ngModel)]="usuario.rol.idRol">
            <option [ngValue]="null">-- Selecciona --</option>
            <option *ngFor="let r of roles" [ngValue]="r.idRol">{{ r.privilegio }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>CORREO (Automático)</label>
          <input type="text" name="correo" [(ngModel)]="usuario.correo" disabled>
        </div>

        <button type="button" (click)="guardar()">Guardar</button>
        <button type="button" (click)="regresar()">Regresar</button>

      </form>
    </div>
  </div>
</div>
