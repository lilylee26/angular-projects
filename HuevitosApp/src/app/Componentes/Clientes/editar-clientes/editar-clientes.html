<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">

      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Editar Cliente</h4>
          <small class="text-white-50">Actualiza los datos del cliente</small>
        </div>

        <div class="card-body">
          <form (ngSubmit)="actualizar()" #f="ngForm">

            <div class="row g-3">

              <div class="col-12 col-md-6">
                <label class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  name="nombre"
                  [(ngModel)]="cliente.nombre"
                  placeholder="Ej: Juan Torres"
                  required
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  name="email"
                  [(ngModel)]="cliente.email"
                  placeholder="Ej: juan@gmail.com"
                  required
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Teléfono</label>
                <input
                  type="text"
                  class="form-control"
                  name="telefono"
                  [(ngModel)]="cliente.telefono"
                  placeholder="Ej: 5512345678"
                  required
                />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Tienda ID</label>
                <input
                  type="number"
                  class="form-control"
                  name="tiendaId"
                  [(ngModel)]="cliente.tiendaId"
                  placeholder="Ej: 1"
                  required
                />
              </div>

              <div class="col-12">
                <label class="form-label">Dirección</label>
                <input
                  type="text"
                  class="form-control"
                  name="direccion"
                  [(ngModel)]="cliente.direccion"
                  placeholder="Ej: Calle la piedad, CDMX"
                  required
                />
              </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
                Actualizar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
