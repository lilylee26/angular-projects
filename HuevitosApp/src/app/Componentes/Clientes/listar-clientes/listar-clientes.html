<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Lista de Clientes</h2>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table">
          <!--table head o encabezado de la tabla-->
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">NOMBRE</th>
              <th scope="col">EMAIL</th>
              <th scope="col">TELEFONO</th>
              <th scope="col">DIRECCION</th>
              <th scope="col">TIENDAID</th>
              <th scope="col">ACCIONES</th>
            </tr>
          </thead>
          <!--table body o cuerpo de la tabla-->
          <tbody>
            @for (cliente of clientes; track cliente.idCliente) {
            <tr>
              <td>{{cliente.idCliente}}</td>
              <td>{{cliente.nombre}}</td>
              <td>{{cliente.email}}</td>
              <td>{{cliente.telefono}}</td>
              <td>{{cliente.direccion}}</td>
              <td>{{cliente.tiendaId}}</td>
              <!--BOTONES PARA ELIMINAR Y EDITAR-->
              <td>
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" class="btn btn-info" (click)="editar(cliente.idCliente)"><i class="bi bi-pencil-square"></i></button>

                  <button type="button" class="btn btn-dark" (click)="eliminar(cliente.idCliente)"><i class="bi bi-trash3-fill"></i></button>


                </div>
              </td>
            </tr>
            }@empty {
            <td colspan="6" style="text-align: center;">No existen registros</td>
            }

          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
