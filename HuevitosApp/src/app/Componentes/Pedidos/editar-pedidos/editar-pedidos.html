<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">

      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Editar Pedido</h4>
          <small class="text-white-50">Actualiza los datos del pedido</small>
        </div>

        <div class="card-body">
          <form (ngSubmit)="actualizar()" #f="ngForm">

            <div class="row g-3">

              <div class="col-12 col-md-6">
                <label class="form-label">Cliente ID</label>
                <input type="number" class="form-control" name="clienteId" [(ngModel)]="pedido.clienteId" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Tienda ID</label>
                <input type="number" class="form-control" name="tiendaId" [(ngModel)]="pedido.tiendaId" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Fecha (yyyy-MM-dd)</label>
                <input type="date" class="form-control" name="fechaPedido" [(ngModel)]="pedido.fechaPedido" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Total</label>
                <input type="number" class="form-control" name="total" [(ngModel)]="pedido.total" required />
              </div>

              <div class="col-12">
                <label class="form-label">Estado</label>
                <input type="text" class="form-control" name="estado" [(ngModel)]="pedido.estado" required />
              </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
                Actualizar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
