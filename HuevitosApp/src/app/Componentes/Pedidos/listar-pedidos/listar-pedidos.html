<div class="container">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Lista de Pedidos</h2>

      <button type="button" class="btn btn-primary" (click)="irGuardar()">
        Nuevo Pedido
      </button>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>CLIENTE ID</th>
              <th>FECHA</th>
              <th>TOTAL</th>
              <th>ESTADO</th>
              <th>TIENDA ID</th>
              <th>ACCIONES</th>
            </tr>
          </thead>

          <tbody>
            @for (pedido of pedidos; track pedido.idPedido) {
            <tr>
              <td>{{pedido.idPedido}}</td>
              <td>{{pedido.clienteId}}</td>
              <td>{{pedido.fechaPedido}}</td>
              <td>{{pedido.total}}</td>
              <td>{{pedido.estado}}</td>
              <td>{{pedido.tiendaId}}</td>

              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-info" (click)="editar(pedido.idPedido)">
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <button type="button" class="btn btn-dark" (click)="eliminar(pedido.idPedido)">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                </div>
              </td>
            </tr>
            } @empty {
            <tr>
              <td colspan="7" style="text-align:center;">No existen registros</td>
            </tr>
            }
          </tbody>

        </table>
      </div>
    </div>
  </div>
</div>
