<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">

      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Guardar Pago</h4>
          <small class="text-white-50">Ingresa los datos para registrar el pago</small>
        </div>

        <div class="card-body">
          <form (ngSubmit)="guardar()" #f="ngForm">
            <div class="row g-3">

              <div class="col-12 col-md-6">
                <label class="form-label">ID Pedido</label>
                <input type="number" class="form-control" name="idPedido" [(ngModel)]="pago.idPedido" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Tienda ID</label>
                <input type="number" class="form-control" name="tiendaId" [(ngModel)]="pago.tiendaId" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Método</label>
                <input type="text" class="form-control" name="metodo" [(ngModel)]="pago.metodo"
                  placeholder="Ej: EFECTIVO / TRANSFERENCIA" required />
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Monto</label>
                <input type="number" class="form-control" name="monto" [(ngModel)]="pago.monto" required />
              </div>

              <div class="form-group col-12 col-md-6">
                <label>Fecha Pago</label>
                <input type="date" class="form-control" name="fechaPago" [(ngModel)]="pago.fechaPago"
                  required />
              </div>


              <div class="col-12 col-md-6">
                <label class="form-label">Estado</label>
                <select class="form-control" name="estado" [(ngModel)]="pago.estado" required>
                  <option value="" disabled selected>Selecciona estado</option>
                  @for (e of estados; track e) {
                  <option [value]="e">{{e}}</option>
                  }
                </select>
              </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
                Cancelar
              </button>

              <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
                Guardar
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
