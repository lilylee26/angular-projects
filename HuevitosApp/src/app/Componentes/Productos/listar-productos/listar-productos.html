<div class="container">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Lista de Productos</h2>

      <button type="button" class="btn btn-primary" (click)="irGuardar()">
        Nuevo Producto
      </button>
    </div>

    <div class="card-body">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>NOMBRE</th>
              <th>DESCRIPCIÓN</th>
              <th>PRECIO</th>
              <th>STOCK</th>
              <th>TIENDA ID</th>
              <th>ACCIONES</th>
            </tr>
          </thead>

          <tbody>
            @for (p of productos; track p.idProducto) {
            <tr>
              <td>{{p.idProducto}}</td>
              <td>{{p.nombre}}</td>
              <td>{{p.descripcion}}</td>
              <td>{{p.precio}}</td>
              <td>{{p.stock}}</td>
              <td>{{p.tiendaId}}</td>

              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-info" (click)="editar(p.idProducto)">
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <button type="button" class="btn btn-dark" (click)="eliminar(p.idProducto)">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                </div>
              </td>
            </tr>
            } @empty {
            <tr>
              <td colspan="7" style="text-align:center;">No existen registros</td>
            </tr>
            }
          </tbody>

        </table>
      </div>
    </div>
  </div>
</div>
